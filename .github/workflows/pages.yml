name: Redirigir GitHub Pages a Cloudflare

# The menus now live on Cloudflare (site/deploy-cloudflare.mjs). GitHub Pages only serves
# redirect pages so old QR codes and shared links keep working.
on:
  push:
    branches: [main]
    paths: ["site/redirect-site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Generar páginas de redirección
        run: node site/redirect-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
