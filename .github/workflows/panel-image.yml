name: Imagen del panel (Render)

# Builds the admin panel (apps/web) as a Docker image on GitHub's runners, which have the memory
# `next build` needs, and pushes it to ghcr.io. Render's free plan only runs the image.
# Optional repo secret RENDER_DEPLOY_HOOK (Render → service → Settings → Deploy Hook) redeploys it.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/panel-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: panel-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/menu3d-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Avisar a Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
