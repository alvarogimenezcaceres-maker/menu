<style>
/* Mesaverso Caja, pantalla del local. Diseño: plan/pos/diseno/fase0.md (gitignored). Marca Mesaverso, acento Maíz (DEC-063). */
:root {

  --bg: var(--mv-noche); --panel: #16181D; --card: #1E2127; --raised: var(--mv-grafito); --line: #34383F;
  --text: var(--mv-niebla); --text-2: var(--mv-titanio); --muted: #9A9FA7; --accent: var(--mv-acento); --on-accent: var(--mv-noche); --focus: var(--mv-acento);

  --shadow: 0 10px 30px -12px rgba(0,0,0,.7);
}
:root[data-theme="light"] {
  --bg: #E9EAE6; --panel: #F6F6F3; --card: #FFFFFF; --raised: #ECEDE9; --line: #D6D8D2; --text: var(--mv-noche); --text-2: #3A3E45; --muted: #5B5F66; --focus: var(--mv-acento-oscuro);

}
* { box-sizing: border-box; }

let pdfAuto = store.get("pdfAuto") !== "off";
function savePdf(lines, name) {

    const t = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Asuncion", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).map(x => [x.type, x.value]));
    a.download = `${name}-${t.year}${t.month}${t.day}-${t.hour}${t.minute}.pdf`; // Paraguay time

}

// The tablet marked as «Caja» saves every comanda, ticket and shift close, whoever did it (the server sends «doc»).
function autoComanda() {}
function onDoc(msg) {
  if (!isCaja() || !pdfAuto) return;
  if (msg.kind === "cierre" && msg.closed) { savePdf(Ticket.resumen(msg.closed.summary, { restaurant: RESTAURANT, openedBy: msg.closed.openedBy, closedBy: msg.closed.closedBy }), "cierre-turno"); return; }
  const o = orders.get(msg.ref); if (!o) return;
  if (msg.kind === "comanda") {
    const lines = msg.round == null ? o.lines : o.lines.filter(l => l.round === msg.round);
    if (lines.length) comandaPdf(o, lines);
  } else if (msg.kind === "ticket") {
    const part = msg.key && o.bill ? { ...o.bill.parts.find(p => p.key === msg.key), method: o.bill.paid[msg.key] } : null;
    savePdf(Ticket.ticket(o, { restaurant: RESTAURANT, part }), "ticket-" + pdfName(o) + (msg.key ? "-" + msg.key : ""));
  }
}

/* ---------- API ---------- */
let device = store.get("device"), session = store.get("session"), me = null;
async function api(path, { method = "GET", body } = {}) {
  const headers = { "content-type": "application/json" };
  if (device) headers["x-device"] = device;
  if (session) headers.authorization = "Bearer " + session;
  let res;
  try { res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw Object.assign(new Error("Sin conexión. Revisá el internet y probá de nuevo."), { code: "net" }); }
  const data = res.status === 204 ? {} : await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = Object.assign(new Error(data.error || "Algo falló. Probá de nuevo."), { code: data.code, status: res.status });
    if (res.status === 401 && path !== "/vincular") handleAuthLost(data.code, e.message);
    throw e;
  }
  return data;
}
function handleAuthLost(code, message) {
  if (/vinculad/.test(message)) { device = null; store.set("device", null); }
  session = null; store.set("session", null); me = null; closeSocket();
  screen = device ? "pin" : "link"; render(); say(message, true);
}

let ws = null, wsTries = 0, wsTimer = 0, pingTimer = 0, online = false;
async function connect() {
  closeSocket();
  try {
    const { ticket } = await api("/ws-ticket", { method: "POST" });
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}${API}/ws?t=${encodeURIComponent(ticket)}`);
    ws.onopen = async () => { wsTries = 0; online = true; await loadState(); renderTop(); clearInterval(pingTimer); pingTimer = setInterval(() => ws && ws.readyState === 1 && ws.send("ping"), 25000); };
    ws.onmessage = e => { if (e.data === "pong") return; try { onMessage(JSON.parse(e.data)); } catch (err) {} };
    ws.onclose = e => { online = false; renderTop(); clearInterval(pingTimer); if (e.code === 4001) { handleAuthLost("auth", "La sesión se cerró."); return; } if (screen === "board") retry(); };
  } catch (e) { online = false; renderTop(); if (e.code !== "auth" && screen === "board") retry(); }
}
function retry() { clearTimeout(wsTimer); wsTimer = setTimeout(connect, Math.min(30000, 1000 * 2 ** wsTries++)); }
function closeSocket() { clearTimeout(wsTimer); clearInterval(pingTimer); if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; } online = false; }
addEventListener("online", () => screen === "board" && connect());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && screen === "board" && (!ws || ws.readyState > 1)) connect(); });
function onMessage(msg) {
  if (msg.t === "doc") { onDoc(msg); return; }
  if (msg.t === "devices") { loadState().catch(() => {}); return; }
  if (msg.t !== "order") return;
  const was = orders.get(msg.order.ref);
  orders.set(msg.order.ref, msg.order);
  if (!was && msg.order.status === "new") alertNew(msg.order);
  const kBefore = was ? JSON.stringify(was.kitchen || {}) + was.status : "";
  if (view === "kitchen" || me?.role === "cocina") {
    const newInKitchen = (msg.order.kind !== "table" && msg.order.status === "prep" && was?.status !== "prep") ||
      Object.entries(msg.order.kitchen || {}).some(([r, k]) => k.status === "pending" && (!was?.kitchen || !was.kitchen[r]));
    if (newInKitchen) { beep(); say(`Comanda nueva · ${msg.order.kind === "table" ? "Mesa " + msg.order.table : "#MV-" + msg.order.ref}`); }
  } else if (me && me.role !== "cocina") {
    const nowReady = (msg.order.kind !== "table" && msg.order.status === "ready" && was?.status === "prep") ||
      Object.entries(msg.order.kitchen || {}).find(([r, k]) => k.status === "ready" && was?.kitchen?.[r]?.status === "pending");
    if (nowReady) { beep(); say(msg.order.kind === "table" ? `Mesa ${msg.order.table}: lista para llevar` : `#MV-${msg.order.ref} listo en cocina`); }
  }
  if (msg.order.kind === "table") {
    const before = new Set((was?.pending || []).map(p => p.id));
    const fresh = (msg.order.pending || []).find(p => !before.has(p.id));
    if (fresh) alertRound(msg.order, fresh);
    if (msg.order.bill && (!was?.bill || was.bill.at !== msg.order.bill.at)) {
      beep(); say(`Mesa ${msg.order.table} pidió la cuenta · ${gs(msg.order.bill.grand)}`);
    }
  }
  renderMain();
  if (detailRef === msg.order.ref) (msg.order.kind === "table" ? openTableDrawer(msg.order.table, true) : openDetail(msg.order.ref, true));
}
async function loadState() {
  const st = await api("/estado");
  me = st.me; catalog = st.catalog; tableCount = st.tables || 20; myDevice = st.device || {};
  if (me.role === "cocina") view = "kitchen";

/* ---------- aviso de pedido nuevo: sonido, vibración y título ---------- */
let audio = null, titleTimer = 0;
function beep() {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const now = audio.currentTime;
    [0, 0.22, 0.44].forEach((d, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = i === 2 ? 1320 : 880; o.type = "sine";
      g.gain.setValueAtTime(0.0001, now + d); g.gain.exponentialRampToValueAtTime(0.35, now + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + d + 0.18);
      o.connect(g).connect(audio.destination); o.start(now + d); o.stop(now + d + 0.2);
    });
  } catch (e) {}
}
function alertNew(o) {
  beep(); try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
  say(`Pedido nuevo #MV-${o.ref}${o.name ? " · " + o.name : ""}`);
  clearInterval(titleTimer); let on = false;
  titleTimer = setInterval(() => { document.title = (on = !on) ? `● Pedido nuevo · ${RESTAURANT}` : `${RESTAURANT} · Caja`; }, 1000);
}
function alertRound(t, p) {
  beep(); try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
  say(`Pedido nuevo · Mesa ${t.table} · ${COLORS[p.color]?.[0] || ""}`);
  clearInterval(titleTimer); let on = false;
  titleTimer = setInterval(() => { document.title = (on = !on) ? `● Mesa ${t.table} pidió · ${RESTAURANT}` : `${RESTAURANT} · Caja`; }, 1000);
}
addEventListener("focus", () => { clearInterval(titleTimer); document.title = `${RESTAURANT} · Caja`; });
// the browser only plays sound after a tap: unlock it with the first one
addEventListener("pointerdown", () => { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} }, { once: true });

/* ---------- tomar el pedido que muestra el comensal ---------- */
let scanStream = null, scanTimer = 0;
function stopScan() { clearInterval(scanTimer); if (scanStream) scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
function takeModal(code = "") {
  const canScan = "BarcodeDetector" in window && navigator.mediaDevices?.getUserMedia;
  showOverlay(`<div class="scrim" data-act="close"></div><form class="modal" id="takeForm" role="dialog" aria-modal="true" aria-labelledby="tk">
    <h2 id="tk">Tomar pedido de mesa</h2>
    <p class="help" style="margin:0">Escaneá el QR que muestra el cliente con la cámara del celular, o escribí las 4 letras que aparecen debajo.</p>
    <div class="field"><label for="tcode">Código del pedido</label><input id="tcode" class="codein" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(code)}" aria-describedby="terr"></div>
    ${canScan ? `<button class="btn block" type="button" data-act="scan" style="margin-top:10px">${ic("scan")}Escanear con esta cámara</button><div class="scanbox" id="scanbox" hidden><video id="scanvid" playsinline muted></video></div>` : ""}
    <p class="err" id="terr" role="alert" hidden></p>
    <div class="grid2" style="margin-top:16px"><button class="btn" type="button" data-act="close">Volver</button><button class="btn primary" type="submit">Ver pedido</button></div></form>`, "#tcode");
  if (code) $("#takeForm").requestSubmit();
}
async function startScan() {
  try {
    const det = new BarcodeDetector({ formats: ["qr_code"] });
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const v = $("#scanvid"); v.srcObject = scanStream; $("#scanbox").hidden = false; await v.play();
    scanTimer = setInterval(async () => {
      try {
        const found = (await det.detect(v))[0];
        const m = found && /[?&]tomar=([A-Z0-9]{4})/i.exec(found.rawValue);
        if (m) { stopScan(); $("#tcode").value = m[1].toUpperCase(); $("#takeForm").requestSubmit(); }
      } catch (e) {}
    }, 300);
  } catch (e) { say("No pude abrir la cámara. Escribí las 4 letras.", true); }
}

let bySlugCache = null, bySlugFor = null;
function bySlug() { if (bySlugFor !== catalog) { bySlugCache = {}; catalog.categories.forEach(c => c.dishes.forEach(d => bySlugCache[d.slug] = d)); bySlugFor = catalog; } return bySlugCache; }
function renderPicker(focus) { const y = $("#overlay .body")?.scrollTop || 0; showOverlay(pickerHtml(), focus || "#none"); const b = $("#overlay .body"); if (b) b.scrollTop = y; }
function dishModal(slug) {
  const d = bySlug()[slug];
  if (!(d.options || []).length) { addPickedLine(slug, [], "", 1); return; }
  const picks = d.options.map(() => []);
  const draw = err => {
    const box = $("#dishBox");
    box.innerHTML = `<h2 id="dm">${esc(d.name)}</h2>
      ${d.options.map((o, gi) => `<div class="field"><span class="lbl">${esc(o.group)} <span class="help">${o.required ? "obligatorio" : "opcional"}${o.multiple ? " · varias" : ""}</span></span>
        <div class="opts" role="group" aria-label="${esc(o.group)}">${o.items.map((it, ii) => `<button type="button" data-g="${gi}" data-i="${ii}" aria-pressed="${picks[gi].includes(ii)}">${esc(it.name)}${it.price ? " +" + gs(it.price) : ""}</button>`).join("")}</div></div>`).join("")}

  };
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="scrim" style="z-index:30"></div><div class="modal" id="dishBox" role="dialog" aria-modal="true" aria-labelledby="dm"></div>`;
  $("#overlay").appendChild(wrap);
  draw();
  wrap.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const box = $("#dishBox"); box.dataset.note = $("#dnote").value;
    if (b.dataset.g != null) {
      const gi = +b.dataset.g, ii = +b.dataset.i, o = d.options[gi];
      picks[gi] = picks[gi].includes(ii) ? picks[gi].filter(x => x !== ii) : o.multiple ? [...picks[gi], ii] : [ii];
      draw(); return;
    }
    if (b.dataset.act === "dishCancel") { wrap.remove(); return; }
    if (b.dataset.act === "dishAdd") {
      const miss = C.missingGroups(d, picks);
      if (miss.length) { draw(`Elegí ${d.options[miss[0]].group}.`); return; }

    }
  });
  setTimeout(() => $("#dishBox button")?.focus(), 0);
}
function addPickedLine(slug, picks, note, n) {
  const k = C.lineKey(slug, picks, note), l = picker.lines.find(x => C.lineKey(x.slug, x.picks, x.note) === k);
  if (l) l.n++; else picker.lines.push({ slug, picks, note, n });
  say(`${bySlug()[slug].name} agregado`); renderPicker();
}

let busy = false;
async function run(ref, op, args = {}, okMsg, after) {
  if (busy) return; busy = true;
  try {
    const cur = orders.get(ref);
    const { order } = await api("/op", { method: "POST", body: { op, ref, args, updatedAt: cur && cur.updatedAt } });
    orders.set(order.ref, order);
    closeOverlay(); renderMain(); if (okMsg) say(okMsg(order));
    if (after) after(order, cur);
    if (op === "accept") { clearInterval(titleTimer); document.title = `${RESTAURANT} · Caja`; }
  } catch (e) { say(e.message, true); if (e.code === "stale" || e.code === "closed" || e.code === "state") loadState().catch(() => {}); }
  finally { busy = false; }
}
document.addEventListener("click", async e => {

    if (pin.length === 4) {
      const typed = pin; pin = "";

        const r = await api("/entrar", { method: "POST", body: { userId: pinUser, pin: typed } });
        session = r.session; store.set("session", session); me = r.me; screen = "board"; view = "orders"; render(); connect();
      } catch (err) { $("#root").innerHTML = pinScreen(err.message); }
    }
    return;
  }
  if (d.view) { view = d.view; render(); if (view === "team") loadTeam(); if (view === "cash") loadShift(); return; }
  if (d.filter) { filter = d.filter; renderMain(); return; }
  if (d.reason) { $("#rtext").value = d.reason; $("#rtext").focus(); return; }
  if (d.rider) { $("#rname").value = d.rider; return; }
  if (d.method) { b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  if (d.cat && picker) { picker.cat = d.cat; renderPicker(); return; }
  if (d.tablen) { openTableDrawer(+d.tablen); return; }
  if (d.pick && taking) { taking.table = +d.pick; takePreview(); return; }
  if (d.dish && picker) { dishModal(d.dish); return; }
  if (d.drop != null && picker) { picker.lines.splice(+d.drop, 1); renderPicker(); return; }
  if (d.ftype && picker) { picker.form.type = d.ftype; renderPicker(); return; }
  if (d.fpay && picker) { picker.form.payment = d.fpay; renderPicker(); return; }
  const ref = d.ref;
  switch (d.act) {
    case "close": closeOverlay(); break;
    case "take": takeModal(); break;
    case "scan": startScan(); break;
    case "takeConfirm": {
      if (busy || !taking?.table) break; busy = true;
      try {
        const r = await api("/op", { method: "POST", body: { op: "take", code: taking.code, table: taking.table } });
        orders.set(r.order.ref, r.order); const n = r.order.table; closeOverlay(); view = "tables"; render();
        say(r.added ? `Agregado a la mesa ${n}` : `Mesa ${n} abierta · pedido aceptado`);
        autoComanda(r.order, lastRound(r.order));
      } catch (err) { say(err.message, true); }
      finally { busy = false; }
      break;
    }
    case "openEmpty": {
      try { const r = await api("/op", { method: "POST", body: { op: "openTable", table: +d.n } }); orders.set(r.order.ref, r.order); closeOverlay(); renderMain(); openTableDrawer(+d.n); say(`Mesa ${d.n} abierta`); }
      catch (err) { say(err.message, true); }
      break;
    }
    case "chargeTable": payModal(ref, false, true); break;
    case "kready": {
      const o = orders.get(ref); if (!o) break;
      if (o.kind === "table") run(ref, "kitchenReady", { round: +d.round }, t => `Mesa ${t.table} lista · avisado al mozo`);
      else run(ref, "ready", {}, x => `#MV-${x.ref} listo · avisado al mozo`);
      break;
    }
    case "kundo": {
      const o = orders.get(ref); if (!o) break;
      run(ref, o.kind === "table" ? "kitchenUndo" : "kitchenUndo", o.kind === "table" ? { round: +d.round } : {}, () => "Volvió a cocina");
      break;
    }
    case "served": run(ref, "served", { round: +d.round }, t => `Mesa ${t.table}: entregado`); break;
    case "payPart": payModal(ref, false, true, d.key); break;
    case "acceptRound": run(ref, "acceptRound", { id: d.id }, o => `Mesa ${o.table}: pedido aceptado`, o => autoComanda(o, lastRound(o))); if (detailRef === ref) setTimeout(() => openTableDrawer(orders.get(ref).table, true), 300); break;
    case "rejectRound": if (confirm("¿Rechazar este pedido? Al cliente le aparece que no se aceptó.")) run(ref, "rejectRound", { id: d.id }, o => `Mesa ${o.table}: pedido rechazado`); break;
    case "tableQr": {
      try {
        const r = await api("/op", { method: "POST", body: { op: "tableQr", ref } });
        showOverlay(`<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="qt" style="text-align:center">
          <h2 id="qt">Mesa ${r.table}: QR para sumarse</h2><p class="help" style="margin:0">Mostráselo a los de la mesa: lo escanean con la cámara y piden desde su celular, cada uno con su color.</p>
          <div class="qrbig" role="img" aria-label="QR de la mesa ${r.table}">${r.qr}</div>
          <button class="btn block" data-act="close" style="margin-top:16px">Cerrar</button></div>`);
      } catch (err) { say(err.message, true); }
      break;
    }
    case "cancelTable": reasonModal(ref, "cancel"); break;
    case "detail": openDetail(ref); break;
    case "accept": run(ref, "accept", {}, o => `#MV-${o.ref} aceptado · a cocina`, o => autoComanda(o, o.lines)); break;
    case "reject": case "cancel": reasonModal(ref, d.act); break;
    case "street": riderModal(ref); break;
    case "ready": run(ref, "ready", {}, o => `#MV-${o.ref} listo para retirar`); break;
    case "deliver": run(ref, "deliver", {}, o => `#MV-${o.ref} entregado · venta cerrada`); break;
    case "rendido": if (confirm(`¿${orders.get(ref).rider || "El delivery"} rindió ${gs(orders.get(ref).total)} de #MV-${ref}?`)) run(ref, "rendido", {}, o => `#MV-${o.ref} rendido · venta cerrada`); break;
    case "paid": payModal(ref, false); break;
    case "charge": payModal(ref, true); break;
    case "addItems": picker = { mode: "add", ref, lines: [], cat: null, q: "" }; renderPicker("#pq"); break;
    case "newOrder": {
      if (!catalog) { say("Primero publicá el menú desde el panel.", true); break; }
      const cfg = C.orderingConfig(catalog.ordering);
      picker = { mode: "new", lines: [], cat: null, q: "", form: { type: cfg.orderTypes[0], name: "", address: "", zone: -1, payment: cfg.paymentMethods[0], note: "" } };
      renderPicker("#fname"); break;
    }
    case "sendAdd": {
      try { const { order } = await api("/op", { method: "POST", body: { op: "addItems", ref: picker.ref, args: { lines: picker.lines } } }); orders.set(order.ref, order); closeOverlay(); renderMain(); say(`Agregado a ${order.kind === "table" ? "la mesa " + order.table : "#MV-" + order.ref} · total ${gs(order.total)}`); autoComanda(order, lastRound(order)); }
      catch (err) { const p = $("#pkErr"); p.hidden = false; p.textContent = err.message; }
      break;
    }
    case "sendNew": {
      try { const { order } = await api("/op", { method: "POST", body: { op: "create", lines: picker.lines, form: picker.form } }); orders.set(order.ref, order); closeOverlay(); renderMain(); say(`Pedido #MV-${order.ref} creado · a cocina`); autoComanda(order, order.lines); }
      catch (err) { const p = $("#pkErr"); p.hidden = false; p.textContent = err.message; }
      break;
    }
    case "sound": soundOn = !soundOn; store.set("sound", soundOn ? "on" : "off"); renderTop(); if (soundOn) beep(); break;
    case "shiftRefresh": loadShift(); break;
    case "shiftPdf": if (shift) savePdf(Ticket.resumen(shift.summary, { restaurant: RESTAURANT, openedBy: shift.openedBy }), "turno-parcial"); break;
    case "oldShiftPdf": { const x = shifts.find(y => y.id === +d.id); if (x) savePdf(Ticket.resumen(x.summary, { restaurant: RESTAURANT, openedBy: x.openedBy, closedBy: x.closedBy }), "turno"); break; }
    case "closeShift": {
      await loadShift(); if (!shift) break;
      const p = shift.summary.pending, left = [p.unpaid && `${p.unpaid} pedidos sin cobrar`, p.openTables && `${p.openTables} mesas abiertas`, Object.keys(p.street).length && "efectivo sin rendir"].filter(Boolean);
      if (!confirm(`¿Cerrar el turno? Vendido: ${gs(shift.summary.sales)}.${left.length ? "\n\nQueda pendiente: " + left.join(", ") + ". Pasa al turno siguiente." : ""}`)) break;
      try {
        const r = await api("/op", { method: "POST", body: { op: "closeShift" } });
        savePdf(Ticket.resumen(r.closed.summary, { restaurant: RESTAURANT, openedBy: r.closed.openedBy, closedBy: r.closed.closedBy }), "cierre-turno");
        say("Turno cerrado · resumen en PDF"); loadShift();
      } catch (err) { say(err.message, true); }
      break;
    }
    case "pdfAuto": pdfAuto = !pdfAuto; store.set("pdfAuto", pdfAuto ? "on" : "off"); renderTop(); say(pdfAuto ? "Esta caja vuelve a guardar los PDF" : "PDF en pausa en esta caja"); break;
    case "comandaPdf": { const o = orders.get(ref); if (o) comandaPdf(o, o.lines); break; }
    case "precuentaPdf": { const o = orders.get(ref); if (o) savePdf(Ticket.precuenta(o, { restaurant: RESTAURANT }), "precuenta-" + pdfName(o)); break; }
    case "theme": { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light"; store.set("theme", r.dataset.theme); break; }
    case "logout": try { await api("/salir", { method: "POST" }); } catch (err) {} session = null; store.set("session", null); me = null; closeSocket(); screen = "pin"; pinUser = null; users = []; usersAsked = false; render(); break;
    case "addUser": userModal(); break;
    case "devKind": teamCall({ action: "deviceKind", id: d.id, kind: d.kind }, d.kind === "caja" ? "Marcada como caja: guarda los PDF" : "Ya no es la caja"); break;
    case "setPin": userModal(+d.id, d.name); break;
    case "removeUser": if (confirm(`¿Quitar a ${d.name}? Ya no va a poder entrar.`)) teamCall({ action: "remove", id: +d.id }, `${d.name} quitado`); break;
    case "unlink": if (confirm(`¿Desvincular «${d.name}»? Para usarlo de nuevo hace falta el código del local.`)) teamCall({ action: "unlinkDevice", id: d.id }, "Dispositivo desvinculado"); break;
    case "newCode": if (confirm("¿Generar un código nuevo? El anterior deja de servir.")) { try { const r = await api("/equipo", { method: "POST", body: { action: "newCode" } }); $("#codeOut").textContent = r.code; say("Código nuevo generado. Anotalo: no se vuelve a mostrar."); } catch (err) { say(err.message, true); } } break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "pq" && picker) { picker.q = e.target.value; const pos = e.target.selectionStart; renderPicker("#pq"); const i = $("#pq"); i.setSelectionRange(pos, pos); }
  if (e.target.dataset.f && picker) picker.form[e.target.dataset.f] = e.target.dataset.f === "zone" ? +e.target.value : e.target.value;
});
document.addEventListener("change", e => {
  if (e.target.dataset.f === "zone" && picker) { picker.form.zone = +e.target.value; }
  if (e.target.dataset.role) teamCall({ action: "role", id: +e.target.dataset.role, role: e.target.value }, "Rol actualizado");
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "linkForm") {
    const body = { code: $("#lcode").value, deviceName: $("#ldev").value, name: $("#lname").value, pin: $("#lpin").value };
    const err = $("#lerr");
    try {
      const r = await api("/vincular", { method: "POST", body });
      device = r.device; store.set("device", device);
      if (r.session) { session = r.session; store.set("session", session); me = r.me; screen = "board"; render(); connect(); say("Tablet vinculada. Sos el encargado: sumá a tu equipo desde «Equipo»."); }
      else { screen = "pin"; users = []; usersAsked = false; render(); say("Tablet vinculada"); }
    } catch (x) {
      // the first link also needs the encargado's name and PIN
      if (x.code === "name" || x.code === "pin") $("#firstFields").hidden = false;
      err.hidden = false; err.textContent = x.code === "name" ? "Es la primera tablet del local: completá tu nombre y un PIN." : x.message;
    }
    return;
  }
  if (f.id === "reasonForm") { const reason = $("#rtext").value.trim(); if (!reason) { $("#rtext").focus(); return; } run(f.dataset.ref, f.dataset.op, { reason }, o => o.kind === "table" ? `Mesa ${o.table} cancelada` : `#MV-${o.ref} ${f.dataset.op === "reject" ? "rechazado" : "cancelado"}`); return; }
  if (f.id === "takeForm") {
    const code = $("#tcode").value.trim().toUpperCase(), err = $("#terr");
    if (!/^[A-Z0-9]{4}$/.test(code)) { err.hidden = false; err.textContent = "El código tiene 4 letras o números."; $("#tcode").focus(); return; }
    try { const r = await api("/op", { method: "POST", body: { op: "draft", code } }); stopScan(); taking = { ...r, table: null }; takePreview(); }
    catch (x) { err.hidden = false; err.textContent = x.message; }
    return;
  }
  if (f.id === "riderForm") {
    const rider = $("#rname").value.trim();
    if (rider) { const list = [rider, ...JSON.parse(store.get("riders") || "[]").filter(x => x !== rider)].slice(0, 6); store.set("riders", JSON.stringify(list)); }
    run(f.dataset.ref, "street", { rider }, o => `#MV-${o.ref} salió${o.rider ? " con " + o.rider : ""}`); return;
  }
  if (f.id === "payForm") {
    const method = $("#payForm .opts button[aria-pressed=true]")?.dataset.method;
    const ticketFor = () => {}; // the caja tablet saves the ticket (server «doc»)
    if (f.dataset.part) {
      if (!method) { say("Elegí la forma de pago.", true); return; }
      const ref = f.dataset.ref;
      const key = f.dataset.part;
      run(ref, "payPart", { key, method }, o => o.status === "paid" ? `Mesa ${o.table} cobrada completa · venta cerrada` : `Parte cobrada · mesa ${o.table}`, o => ticketFor(o, key));
      setTimeout(() => { const t = orders.get(ref); if (t && t.status === "open") openTableDrawer(t.table, true); }, 400);
      return;
    }
    if (f.dataset.table) { if (!method) { say("Elegí la forma de pago.", true); return; } run(f.dataset.ref, "charge", { method }, o => `Mesa ${o.table} cobrada · venta cerrada`, o => ticketFor(o)); return; }
    run(f.dataset.ref, "paid", { method, deliver: !!f.dataset.deliver }, o => `#MV-${o.ref}: ${f.dataset.deliver ? "cobrado y entregado" : "pago recibido"}`, o => ticketFor(o)); return;
  }
  if (f.id === "userForm") {
    const pinv = $("#upin").value, id = f.dataset.id;
    if (!/^\d{4}$/.test(pinv)) { const p = $("#uerr"); p.hidden = false; p.textContent = "El PIN tiene 4 números."; return; }
    if (id) teamCall({ action: "pin", id: +id, pin: pinv }, "PIN cambiado");
    else teamCall({ action: "add", name: $("#uname").value, role: $("#urole").value, pin: pinv }, "Persona agregada");
  }
});
function userModal(id, name) {
  showOverlay(`<div class="scrim" data-act="close"></div><form class="modal" id="userForm" data-id="${id || ""}" role="dialog" aria-modal="true" aria-labelledby="ut">
    <h2 id="ut">${id ? "Cambiar PIN de " + esc(name) : "Agregar persona"}</h2>
    ${id ? "" : `<div class="field"><label for="uname">Nombre</label><input id="uname" maxlength="30" required></div>
      <div class="field"><label for="urole">Rol</label><select id="urole"><option value="mozo">Mozo: acepta y carga pedidos</option><option value="cajero">Cajero: además cobra</option><option value="encargado">Encargado: además cancela y maneja el equipo</option><option value="cocina">Cocina: solo ve las comandas y marca «Listo»</option></select></div>`}
    <div class="field"><label for="upin">PIN de 4 números</label><input id="upin" inputmode="numeric" maxlength="4" autocomplete="off" required></div>
    <p class="err" id="uerr" role="alert" hidden></p>
    <div class="grid2" style="margin-top:16px"><button class="btn" type="button" data-act="close">Volver</button><button class="btn primary" type="submit">Guardar</button></div></form>`);
}
async function teamCall(body, okMsg) {
  try { team = await api("/equipo", { method: "POST", body }); closeOverlay(); renderMain(); say(okMsg); }
  catch (err) { const p = $("#uerr"); if (p) { p.hidden = false; p.textContent = err.message; } else say(err.message, true); if (body.action === "role") loadTeam(); }
}

/* ---------- tablet: que la pantalla no se apague con la caja abierta ---------- */
let wake = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible" && screen === "board" && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) { wake = null; }
}
document.addEventListener("visibilitychange", keepAwake);
addEventListener("pointerdown", keepAwake);

/* ---------- arranque ---------- */
render();
if (screen === "board") loadState().then(connect).catch(() => {});
</script>
</body>
</html>
