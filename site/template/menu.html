<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NAME}} · Menú</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="{{BG}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="restaurant.menu">
<meta property="og:title" content="{{NAME}} · Menú">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{URL}}img/{{OG_IMAGE}}.webp">
<link rel="icon" href="img/{{LOGO}}-360.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Questrial&family=Playfair+Display:wght@500;600&display=swap">
<script type="application/ld+json">{{JSONLD}}</script>
<style>
  :root {
    color-scheme: dark;
    --ink: {{BG}};
    --surface: #1b1916;
    --raised: #24211d;
    --line: #34302a;
    --amber: {{PRIMARY}};
    --amber-soft: {{PRIMARY_LIGHT}};
    --text: #f3ede3;
    --muted: #a89f92;
    --wine: {{WINE}};
    --wine-text: #d98a9e;
    --glow: rgba(237, 157, 21, .16);
    --display: "League Spartan", "Century Gothic", "Futura", system-ui, sans-serif;
    --body: "Questrial", "Century Gothic", "Avenir Next", system-ui, sans-serif;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --col: 520px;
    --bar-h: 118px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar-h) + 12px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .skip { position: absolute; left: 16px; top: -60px; z-index: 30; background: var(--amber); color: #15100a; padding: 10px 14px; border-radius: 10px; font: 600 14px/1 var(--display); text-decoration: none; }
  .skip:focus { top: calc(8px + env(safe-area-inset-top, 0px)); }
  :focus-visible { outline: 2px solid var(--amber-soft); outline-offset: 2px; border-radius: 6px; }
  .app { width: 100%; max-width: var(--col); min-width: 0; margin: 0 auto; padding-block: 16px 40px; }

  .hero {
    position: relative; overflow: hidden; border-radius: 18px;
    background: radial-gradient(120% 90% at 85% 60%, #2a2118 0%, var(--surface) 55%, #0d0c0b 100%);
    min-height: 240px; padding: 22px 20px; display: grid; grid-template-columns: minmax(0, 1fr) 44%; align-items: center;
  }
  .hero .brand { position: relative; z-index: 1; display: grid; gap: 10px; justify-items: start; }
  .hero .brand h1 { margin: 0; }
  .hero .logo { width: 150px; max-width: 100%; display: block; }
  .hero p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 22ch; }
  .hero .dish { position: absolute; right: -18px; bottom: -8px; width: 52%; max-width: 250px; filter: drop-shadow(0 14px 24px rgba(0,0,0,.6)); }
  .table-chip { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; background: var(--amber); color: #1a1206; padding: 8px 12px 7px; border-radius: 999px; }

  .toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 12px 10px; margin-top: 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .search { position: relative; }
  .search input { width: 100%; min-height: 48px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 48px 12px 42px; outline: none; font-size: 16px; }
  .search input::placeholder { color: var(--muted); opacity: 1; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus { border-color: var(--amber); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); }
  .search .clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; border-radius: 10px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent); mask-image: linear-gradient(90deg, #000 86%, transparent); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-height: 40px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; cursor: pointer; white-space: nowrap; font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .chip:last-child { margin-right: 40px; }
  .chip[aria-current="true"] { background: var(--amber); border-color: var(--amber); color: #1a1206; }

  section.cat { scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding-top: 22px; }
  .cat-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px; margin-bottom: 6px; }
  .cat-head h2 { margin: 0 0 0 -16px; font: 700 26px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; display: inline-block; background: var(--amber); color: #15100a; padding: 9px 14px 5px 16px; border-radius: 0 6px 6px 0; }
  .cat-head .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .cat-note { color: var(--amber-soft); font-size: 14px; margin: 10px 0 4px; }
  .cat-cover { display: block; width: 100%; max-height: 190px; object-fit: contain; margin: 8px 0 0; filter: drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
  .cat.wine .cat-head h2 { background: var(--wine); color: #fff; font: 500 30px/1 var(--serif); text-transform: none; letter-spacing: 0; padding-bottom: 8px; }

  .dishes { list-style: none; margin: 0; padding: 0; }
  .dish-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 2px; cursor: pointer; }
  .dish-row > span:first-child { display: block; min-width: 0; }
  .dish-row:hover .name { color: var(--amber-soft); }
  .dish-row { transition: background-color .12s; border-radius: 10px; }
  .dish-row:active { background: var(--raised); }
  .dish-row .line { display: flex; align-items: baseline; gap: 8px; }
  .dish-row .name { font: 600 17px/1.25 var(--display); letter-spacing: .01em; transition: color .15s; }
  .dish-row .leader { flex: 1; border-bottom: 1px dotted #5a5247; transform: translateY(-4px); min-width: 12px; }
  .price { font: 600 16px/1 var(--display); color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price small { font-size: .78em; margin-right: 2px; }
  .dish-row .desc { display: -webkit-box; margin: 6px 0 0; color: var(--muted); font-size: 15px; line-height: 1.45; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .tag { font-size: 12.5px; letter-spacing: .03em; color: var(--amber-soft); border: 1px solid rgba(255,185,67,.35); border-radius: 999px; padding: 2px 8px; }
  .tag.t3d { background: var(--amber); border-color: var(--amber); color: #1a1206; font-weight: 600; }
  .tag.sold { background: #3a3530; border-color: #3a3530; color: var(--text); font-weight: 600; }
  .dish-row.is-sold .name, .dish-row.is-sold .price { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1px; }
  .dish-row.is-sold .thumb img { filter: grayscale(1) drop-shadow(0 6px 10px rgba(0,0,0,.55)); opacity: .6; }
  .thumb { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); }
  .thumb img { max-width: 92px; max-height: 84px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
  .wine .dish-row .name { font: 600 17px/1.25 var(--serif); }
  .wine .price { color: var(--wine-text); }
  .wine .tag { color: var(--wine-text); border-color: rgba(217,138,158,.35); }
  .empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 15px; }
  footer.foot { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 0 8px; display: grid; gap: 6px; justify-items: center; }
  footer.foot img { width: 90px; opacity: .6; }
  footer.foot .privacy { font-size: 12px; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 20; opacity: 0; transition: opacity .2s; }
  .scrim.open { opacity: 1; }
  .sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: min(100%, var(--col)); max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: translate(-50%, 0); }
  .grip { width: 44px; height: 5px; border-radius: 4px; background: #4a443c; margin: 0 auto 10px; }
  .sheet.dragging { transition: none; }
  .sheet .close { position: absolute; right: 8px; top: 6px; background: var(--raised); border: 0; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 24px; line-height: 1; color: var(--text); z-index: 2; }
  .stage { position: relative; height: 280px; border-radius: 16px; margin-top: 6px; background: radial-gradient(60% 60% at 50% 55%, #3a2d1c 0%, var(--raised) 60%, var(--surface) 100%); display: grid; place-items: center; overflow: hidden; }
  .stage > img { max-height: 250px; max-width: 92%; object-fit: contain; filter: drop-shadow(0 18px 24px rgba(0,0,0,.6)); }
  .stage .noimg { font: 700 64px/1 var(--display); color: var(--line); }
  .stage model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; --poster-color: transparent; --progress-bar-color: var(--amber); --progress-bar-height: 2px; }
  .stage .loading { color: var(--muted); font-size: 13px; }
  .modes { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; background: rgba(18,17,16,.75); padding: 3px; border-radius: 999px; z-index: 1; }
  .modes button { min-height: 36px; min-width: 60px; background: none; border: 0; border-radius: 999px; padding: 0 14px; cursor: pointer; font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--amber); color: #1a1206; }
  .hint3d { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; }
  .sheet .sheet-title { font: 700 24px/1.15 var(--display); margin: 16px 0 4px; text-wrap: balance; }
  .sheet.is-wine .sheet-title { font: 600 25px/1.2 var(--serif); }
  .sheet .price { font-size: 19px; }
  .sheet .desc { color: #d6cfc4; margin: 12px 0 0; white-space: pre-line; font-size: 16px; line-height: 1.55; }
  .block-label { font: 600 12.5px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .ingr { display: flex; flex-wrap: wrap; gap: 6px; }
  .ingr span { background: var(--raised); border-radius: 8px; padding: 5px 10px; font-size: 14px; }
  .ar-btn { margin-top: 20px; width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--amber); color: #1a1206; border: 0; border-radius: 14px; padding: 15px 16px 13px; cursor: pointer; font: 700 16px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .ar-btn svg { width: 22px; height: 22px; }
  .ar-note { margin-top: 10px; background: var(--raised); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #d6cfc4; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .ar-note img { width: 96px; background: #fff; border-radius: 8px; padding: 4px; }
  .model-note { margin-top: 8px; font-size: 13px; color: var(--muted); text-align: center; }

  /* ================= Futurista: ambiente, vidrio y movimiento ================= */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  body::before {
    content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40vmax 40vmax at 18% 8%, rgba(237,157,21,.14), transparent 60%),
      radial-gradient(46vmax 46vmax at 88% 72%, rgba(143,27,81,.18), transparent 62%),
      radial-gradient(30vmax 30vmax at 60% 34%, rgba(255,185,67,.06), transparent 60%);
  }
  .motion body::before { animation: aurora 28s ease-in-out infinite alternate; }
  @keyframes aurora { to { transform: translate3d(-6vmax, 5vmax, 0) rotate(9deg); } }

  .hero { isolation: isolate; border: 1px solid rgba(255,185,67,.16); box-shadow: 0 30px 60px -34px rgba(237,157,21,.35), inset 0 1px 0 rgba(255,255,255,.05); }
  .hero::after { content: ""; position: absolute; right: 2%; bottom: 4%; width: 50%; height: 20%; z-index: -1; background: radial-gradient(closest-side, rgba(237,157,21,.5), transparent); filter: blur(12px); }
  .motion .hero .dish { animation: float 6s ease-in-out infinite; }
  /* sin plato de portada: el logo al centro */
  .hero:not(:has(.dish)) { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .hero:not(:has(.dish)) .brand { justify-items: center; text-align: center; }
  .hero:not(:has(.dish)) .logo { width: 190px; }
  .hero:not(:has(.dish)) p { max-width: 30ch; }
  .hero:not(:has(.dish))::after { right: 25%; bottom: auto; top: 30%; height: 40%; opacity: .5; }
  @keyframes float { 50% { transform: translateY(-9px) rotate(-1.5deg); } }

  .toolbar {
    margin-inline: -16px; padding-inline: 16px;
    background: rgba(18,17,16,.66); -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
    border-bottom: 1px solid rgba(255,185,67,.1);
  }
  .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; transform-origin: left; transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, var(--amber), var(--amber-soft)); box-shadow: 0 0 12px rgba(237,157,21,.8); }
  .chip[aria-current="true"] { box-shadow: 0 0 18px -2px rgba(237,157,21,.6); }
  .search input { background: rgba(27,25,22,.7); }

  .cat-head h2 { position: relative; overflow: hidden; }
  .cat-head h2::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-120%); }
  .motion .cat.seen .cat-head h2::after { animation: shine 1.1s .1s ease-out 1; }
  @keyframes shine { to { transform: translateX(120%); } }

  .motion .dishes li.pre { opacity: 0; transform: translateY(16px) scale(.98); }
  .motion .dishes li.in { opacity: 1; transform: none; transition: opacity .38s ease-out, transform .46s cubic-bezier(.34,1.56,.64,1); transition-delay: calc(var(--i, 0) * 55ms); }
  .thumb img { transition: transform .28s cubic-bezier(.34,1.56,.64,1); }
  .dish-row:active .thumb img { transform: scale(1.07) rotate(-4deg); }

  .tag.t3d { background: linear-gradient(110deg, #ED9D15 0%, #FFD98A 35%, #ED9D15 55%, #FFB943 100%); background-size: 220% 100%; border-color: transparent; }
  .motion .tag.t3d { animation: holo 3.4s linear infinite; }
  @keyframes holo { to { background-position: -220% 0; } }

  /* favoritos */
  .dishes li { position: relative; }
  .dishes li.no-thumb .dish-row { grid-template-columns: minmax(0, 1fr) 44px; }
  .fav {
    position: absolute; right: 62px; bottom: 10px; width: 40px; height: 40px; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--line); background: rgba(27,25,22,.82); color: var(--muted); cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: background-color .2s, color .2s, box-shadow .2s;
  }
  .dishes li.no-thumb .fav { right: 0; top: 50%; bottom: auto; margin-top: -20px; }
  .fav svg { width: 19px; height: 19px; }
  .fav svg path, .sel-btn svg path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .fav[aria-pressed="true"] { color: #15100a; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 18px rgba(237,157,21,.6); }
  .fav[aria-pressed="true"] svg path, .sel-btn[aria-pressed="true"] svg path { fill: currentColor; }
  .pop { animation: pop .42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 40% { transform: scale(1.28); } }

  /* destacados + sorprendeme */
  .spot { margin-top: 20px; }
  .spot-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .spot-head h2 { margin: 0; font: 700 15px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--amber-soft); }
  .surprise {
    min-height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,185,67,.38); background: rgba(237,157,21,.1); color: var(--amber-soft);
    font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
  }
  .surprise svg { width: 18px; height: 18px; }
  .surprise.rolling svg { animation: roll .55s linear infinite; }
  @keyframes roll { to { transform: rotate(360deg); } }
  .rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 12px 16px 8px; margin-inline: -16px; scrollbar-width: none; scroll-padding-inline: 16px; }
  .rail::-webkit-scrollbar { display: none; }
  .card {
    flex: none; width: 164px; scroll-snap-align: start; position: relative; display: grid; gap: 6px; padding: 12px 12px 14px;
    border-radius: 18px; text-align: left; cursor: pointer; color: var(--text);
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.015)); border: 1px solid rgba(255,185,67,.18);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .card .ph { height: 112px; display: grid; place-items: center; background: radial-gradient(closest-side, rgba(237,157,21,.3), transparent 75%); }
  .card img { max-height: 108px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0,0,0,.6)); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .card:active img, .card:hover img { transform: scale(1.07) rotate(-4deg); }
  .card .n { font: 600 15.5px/1.2 var(--display); }
  .card .tag { position: absolute; top: 10px; left: 10px; }

  /* barra "Mi selección" */
  .selbar {
    position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 15;
    width: min(calc(100% - 24px), 496px); transform: translate(-50%, 150%);
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 18px;
    border: 1px solid rgba(255,185,67,.32); background: rgba(27,25,22,.74);
    -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.85), 0 0 34px -10px rgba(237,157,21,.45);
    transition: transform .38s cubic-bezier(.34,1.56,.64,1);
  }
  .selbar.show { transform: translate(-50%, 0); }
  .selbar .info { display: grid; gap: 4px; min-width: 0; flex: 1; }
  .selbar .t { font: 600 12.5px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .selbar .sum { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  .selbar button { min-height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--amber); color: #15100a; font: 700 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  body.has-sel .app { padding-bottom: 104px; }

  /* botón de selección en la ficha y panel de la selección */
  .sel-btn {
    margin-top: 14px; width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    border-radius: 14px; border: 1px solid rgba(255,185,67,.45); background: rgba(237,157,21,.08); color: var(--amber-soft);
    font: 700 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase;
  }
  .sel-btn svg { width: 20px; height: 20px; }
  .sel-btn[aria-pressed="true"] { background: rgba(237,157,21,.18); border-color: var(--amber); color: var(--text); }
  .sel-list { list-style: none; margin: 14px 0 0; padding: 0; }
  .sel-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sel-item .nm { font: 600 16px/1.25 var(--display); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--text); }
  .sel-item .sub { color: var(--muted); font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .qty { display: inline-flex; align-items: center; gap: 4px; }
  .qty button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  .qty output { min-width: 26px; text-align: center; font: 700 16px/1 var(--display); font-variant-numeric: tabular-nums; }
  .sel-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; font: 700 20px/1 var(--display); }
  .sel-total .price { font-size: 22px; }
  .sel-hint { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--raised); color: #d6cfc4; font-size: 14.5px; }
  .order { display: grid; gap: 10px; margin-top: 16px; }
  .order .ar-btn { margin-top: 0; text-decoration: none; }
  .order .sel-btn { margin-top: 0; text-decoration: none; }
  .order svg { width: 20px; height: 20px; flex: none; }
  .waiter { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: var(--ink); padding: calc(24px + env(safe-area-inset-top, 0px)) 22px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; align-content: start; gap: 6px; }
  .waiter[hidden] { display: none; }
  .waiter .who { font: 600 14px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .waiter .mesa { font: 700 44px/1.05 var(--display); color: var(--amber); margin: 4px 0 10px; }
  .waiter ul { list-style: none; margin: 0; padding: 0; }
  .waiter li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); font: 600 24px/1.2 var(--display); }
  .waiter li b { color: var(--amber); font-variant-numeric: tabular-nums; min-width: 2.2ch; }
  .waiter .tot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; font: 700 26px/1 var(--display); }
  .waiter .done { margin-top: 26px; }
  .waiter .tot .price { font-size: 30px; }
  .sel-clear { margin-top: 12px; min-height: 44px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; }

  /* opciones del plato (tamaño, extras) y aclaración */
  :root { --err: #ff9d8c; }
  .price .from { font: 500 12px/1 var(--body); color: var(--muted); margin-right: 4px; letter-spacing: 0; }
  fieldset.opt { border: 0; margin: 18px 0 0; padding: 0; min-width: 0; }
  fieldset.opt legend { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 0; margin-bottom: 10px; font: 600 16px/1.2 var(--display); }
  fieldset.opt legend .req { font: 500 13px/1.2 var(--body); color: var(--muted); }
  fieldset.opt.invalid legend .req { color: var(--err); }
  .opt-choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { position: relative; display: inline-flex; }
  .choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .choice span { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); font-size: 15px; line-height: 1.25; transition: background-color .15s, border-color .15s, color .15s; }
  .choice span em { font-style: normal; color: var(--amber-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .choice input:checked + span { background: var(--amber); border-color: var(--amber); color: #15100a; font-weight: 600; }
  .choice input:checked + span em { color: #15100a; }
  .choice input:focus-visible + span { outline: 2px solid var(--amber-soft); outline-offset: 2px; }
  .err { margin: 8px 0 0; color: var(--err); font-size: 14px; }
  .field { display: grid; gap: 6px; margin-top: 16px; }
  .field > label { font: 600 15px/1.2 var(--display); }
  .opt-l, .help { font: 400 13px/1.3 var(--body); color: var(--muted); }
  .waiter .wx { display: block; font: 500 17px/1.3 var(--body); color: var(--muted); }
  .waiter .wx.note { color: var(--amber-soft); }
  .field input, .field textarea, .field select { width: 100%; min-height: 48px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none; }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--amber); }
  .field [aria-invalid="true"] { border-color: var(--err); }
  .add-bar { position: sticky; bottom: calc(-22px - env(safe-area-inset-bottom, 0px)); z-index: 2; display: flex; gap: 12px; align-items: center; margin: 18px -20px 0; padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  .add-btn { flex: 1; min-height: 52px; border: 0; border-radius: 14px; background: var(--amber); color: #1a1206; cursor: pointer; font: 700 16px/1 var(--display); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
  .add-btn.done { background: var(--raised); color: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber); }
  .in-sel { margin: 10px 0 0; color: var(--muted); font-size: 14px; text-align: center; }
  .in-sel button { background: none; border: 0; color: var(--amber-soft); text-decoration: underline; cursor: pointer; min-height: 44px; font-size: 14px; }
  .sel-item .sub .x { display: block; color: #d6cfc4; }

  /* checkout de WhatsApp */
  .co { margin-top: 8px; }
  .co h3 { margin: 22px 0 0; font: 700 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .seg .choice span { width: 100%; justify-content: center; }
  .choice.wide { flex: 1 1 140px; }
  .choice.wide span { width: 100%; }
  .pay-info { margin: 10px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--raised); border: 1px dashed rgba(255,185,67,.35); white-space: pre-line; font-size: 14.5px; }
  .totals { margin-top: 20px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
  .totals div { display: flex; justify-content: space-between; color: #d6cfc4; }
  .totals .grand { margin-top: 6px; color: var(--text); font: 700 20px/1 var(--display); }
  .totals .grand .price { font-size: 22px; }
  .notice { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(255,157,140,.1); border: 1px solid rgba(255,157,140,.35); color: var(--text); font-size: 14.5px; }
  .order a[aria-disabled="true"] { opacity: .55; }
  .open-chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 7px 10px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .open-chip i { width: 8px; height: 8px; border-radius: 50%; background: #7bc47f; }
  .open-chip.closed i { background: var(--err); }
</style>
</head>
<body>
<a class="skip" href="#menu">Ir al menú</a>
<main class="app">
  <header class="hero">
    <div class="brand">
      <h1><img class="logo" src="img/{{LOGO}}-360.webp" alt="{{NAME}}"></h1>
      <p>{{TAGLINE}}</p>
      <span class="table-chip" id="tableChip" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 10h18M6 10v9M18 10v9M4 6h16"/></svg>
        <span id="tableLabel"></span>
      </span>
      <span class="open-chip" id="openChip" hidden><i aria-hidden="true"></i><span></span></span>
    </div>
    {{HERO_IMG}}
  </header>

  <div class="toolbar" id="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar un plato o ingrediente" autocomplete="off" aria-label="Buscar en el menú">
      <button class="clear" id="clearQ" type="button" aria-label="Borrar búsqueda" hidden>×</button>
    </div>
    <nav class="chips" id="chips" aria-label="Categorías"></nav>
    <div class="progress" aria-hidden="true"></div>
  </div>

  <section class="spot" id="spot" aria-labelledby="spotTitle" hidden>
    <div class="spot-head">
      <h2 id="spotTitle">Destacados</h2>
      <button class="surprise" id="surprise" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></svg>
        <span>Sorprendeme</span>
      </button>
    </div>
    <div class="rail" id="rail"></div>
  </section>

  <div id="menu" tabindex="-1"></div>
  <p class="empty" id="empty" hidden></p>

  <footer class="foot">
    <img src="img/{{LOGO}}-360.webp" alt="">
    <span>Precios en guaraníes (₲). Consultá por alérgenos al personal.</span>
    <span class="privacy">Este menú cuenta visitas y pedidos de forma anónima, sin cookies ni datos personales.</span>
  </footer>
</main>

<div class="selbar" id="selbar" hidden>
  <div class="info"><span class="t">Mi selección · <span id="selCount">0</span></span><span class="sum" id="selSum"></span></div>
  <button type="button" id="openSel">Ver lista</button>
</div>
<div id="live" class="sr-only" aria-live="polite"></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="selSheet" role="dialog" aria-modal="true" aria-labelledby="selTitle" hidden>
  <div class="grip" aria-hidden="true"></div>
  <button class="close" id="closeSel" type="button" aria-label="Cerrar">×</button>
  <h2 id="selTitle" class="sheet-title">Mi selección</h2>
  <div id="selBody"></div>
</div>
<div class="waiter" id="waiter" role="dialog" aria-modal="true" aria-labelledby="waiterTitle" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grip" aria-hidden="true"></div>
  <button class="close" id="closeSheet" type="button" aria-label="Cerrar">×</button>
  <div class="stage" id="stage"></div>
  <h2 id="sheetTitle" class="sheet-title"></h2>
  <div class="price" id="sheetPrice"></div>
  <p class="desc" id="sheetDesc"></p>
  <div id="sheetExtra"></div>
  <div id="addBox"></div>
</div>

<script>
const DATA = {{DATA}};
const RESTAURANT = {{NAME_JSON}};
const WHATSAPP = "{{WHATSAPP}}"; // solo dígitos, con código de país; vacío = sin botón
const CFG = {{ORDERING}}; // tipos de pedido, envío, mínimo, formas de pago y horarios (OrderCore.orderingConfig)
{{ORDER_CORE}}
const C = OrderCore;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const fmt = n => `<span class="price"><small>₲</small>${n.toLocaleString("es-PY")}</span>`;
// lowest possible price: required groups add their cheapest option
const fromPrice = d => (d.options || []).reduce((p, o) => p + (o.required ? Math.min(...o.items.map(i => i.price)) : 0), d.price);
const hasPricedOptions = d => (d.options || []).some(o => o.items.some(i => i.price > 0));
const fmtDish = d => hasPricedOptions(d) ? fmt(fromPrice(d)).replace("<small>", '<span class="from">desde</span><small>') : fmt(d.price);
const needsChoice = d => (d.options || []).some(o => o.required);
const TAG_LABEL = { "para compartir": "Para compartir", destacado: "Destacado", picante: "Picante", "sin gluten": "Sin gluten", "sin alcohol": "0,0 %", "de la casa": "De la casa", extra: "Agregado" };
const DRINKS = ["vinos", "cervezas", "sin-alcohol", "cocteles"];
const menuEl = $("#menu"), chipsEl = $("#chips");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!REDUCED) document.documentElement.classList.add("motion");
const haptic = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} };
const plain = n => "₲ " + n.toLocaleString("es-PY");
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.1 3.6 4.5 7.1 4.5c2 0 3.4 1.1 4.9 2.9 1.5-1.8 2.9-2.9 4.9-2.9 3.5 0 5.6 3.6 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2Z"/></svg>';
const replay = (el, cls) => { if (REDUCED || !el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

/* table from the QR: ?table=8 or ?mesa=8 */
const params = new URLSearchParams(location.search);
const table = (params.get("table") || params.get("mesa") || "").slice(0, 12);
if (table) { $("#tableLabel").textContent = "Mesa " + table; $("#tableChip").hidden = false; }

/* abierto / cerrado según los horarios del local (hora de Paraguay); en la mesa no aplica */
const openNow = () => (table ? null : C.openState(CFG.hours));
function renderOpenChip() {
  const st = openNow(), chip = $("#openChip");
  chip.hidden = !st;
  if (!st) return;
  chip.classList.toggle("closed", !st.open);
  chip.querySelector("span").textContent = st.open ? `Abierto hasta las ${st.until}` : `Cerrado · abre ${st.next}`;
}
renderOpenChip(); setInterval(renderOpenChip, 60000);

/* anonymous analytics: events stay in memory and go to /e a few seconds after the last one, when the
   page is hidden and right away when the order is sent (phones may kill a hidden tab before its
   beacon leaves). No cookies, no storage, no personal data; see site/worker.js. */
const SLUG = location.pathname.split("/").filter(Boolean).pop() || "";
const SRC = (s => ["qr", "ig", "maps", "wa", "dir", "fb", "web"].includes(s) ? s : table ? "qr" : "direct")(params.get("s"));
const VISIT = Math.random().toString(36).slice(2, 12).padEnd(8, "0");
const seen = new Set();
let evBuf = [], idleTimer = 0;
function flushEvents() {
  clearTimeout(idleTimer);
  if (!evBuf.length || !navigator.sendBeacon) return;
  try {
    const now = new Date(), batch = evBuf.slice(0, 50);
    const body = JSON.stringify({ v: 1, slug: SLUG, visit: VISIT, src: SRC, dev: matchMedia("(pointer: coarse)").matches ? "m" : "d",
      hour: now.getHours(), dow: now.getDay(), webdriver: navigator.webdriver === true, events: batch });
    // keep the events when the browser refuses the beacon; they go with the next flush
    if (navigator.sendBeacon("/e", new Blob([body], { type: "text/plain" }))) evBuf = evBuf.slice(batch.length);
  } catch (e) {}
}
function track(ev, data = {}, once) {
  try {
    if (once) { if (seen.has(once)) return; seen.add(once); }
    evBuf.push({ ev, ...data });
    if (evBuf.length >= 50) flushEvents();
    else { clearTimeout(idleTimer); idleTimer = setTimeout(flushEvents, 5000); }
  } catch (e) {}
}
addEventListener("pagehide", flushEvents);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushEvents(); });
track("menu_view");

function tagsHtml(c, d) {
  const t = d.tags || [];
  const labels = c.slug === "vinos" ? t.map(esc) : t.filter(x => TAG_LABEL[x]).map(x => TAG_LABEL[x]);
  if (!d.model && !labels.length && !d.soldOut) return "";
  return `<span class="tags">${d.soldOut ? '<span class="tag sold">Agotado hoy</span>' : ""}${d.model ? '<span class="tag t3d">3D · AR</span>' : ""}${labels.map(l => `<span class="tag">${l}</span>`).join("")}</span>`;
}
menuEl.innerHTML = DATA.categories.map(c => `
  <section class="cat${c.slug === "vinos" ? " wine" : ""}" id="${c.slug}" data-cat="${c.slug}">
    <div class="cat-head"><h2>${esc(c.name)}</h2><span class="count">${c.dishes.length} opciones</span></div>
    ${c.description ? `<p class="cat-note">${esc(c.description)}</p>` : ""}
    ${c.cover ? `<img class="cat-cover" src="img/${c.cover}-720.webp" alt="" loading="lazy">` : ""}
    <ul class="dishes">
      ${c.dishes.map(d => `
        <li${d.photo ? "" : ' class="no-thumb"'} data-search="${esc(norm([d.name, d.description, (d.ingredients || []).join(" "), (d.tags || []).join(" "), c.name].join(" ")))}">
          <button class="dish-row${d.soldOut ? " is-sold" : ""}" type="button" data-dish="${d.slug}" aria-haspopup="dialog">
            <span>
              <span class="line"><span class="name">${esc(d.name)}</span><span class="leader" aria-hidden="true"></span>${fmtDish(d)}</span>
              ${d.description ? `<span class="desc">${esc(d.description.split("\n")[0])}</span>` : ""}
              ${tagsHtml(c, d)}
            </span>
            ${d.photo ? `<span class="thumb"><img src="img/${d.photo}-360.webp" alt="" loading="lazy"></span>` : '<span aria-hidden="true"></span>'}
          </button>
          ${d.soldOut ? "" : `<button class="fav" type="button" data-fav="${d.slug}" aria-pressed="false" aria-label="Agregar ${esc(d.name)} a mi selección">${HEART}</button>`}
        </li>`).join("")}
    </ul>
  </section>`).join("");
chipsEl.innerHTML = DATA.categories.map(c => `<button class="chip" type="button" data-go="${c.slug}">${esc(c.name)}</button>`).join("");

const bySlug = {};
DATA.categories.forEach(c => c.dishes.forEach(d => bySlug[d.slug] = { ...d, cat: c }));

/* category nav + scrollspy */
chipsEl.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) document.getElementById(b.dataset.go).scrollIntoView(); });
function setCurrent(slug) {
  chipsEl.querySelectorAll(".chip").forEach(ch => {
    const on = ch.dataset.go === slug;
    if (on && ch.getAttribute("aria-current") !== "true") chipsEl.scrollTo({ left: ch.offsetLeft - 16, behavior: "smooth" });
    ch.setAttribute("aria-current", on ? "true" : "false");
  });
}
const measureBar = () => document.documentElement.style.setProperty("--bar-h", $("#toolbar").offsetHeight + "px");
measureBar(); addEventListener("resize", measureBar);
let spyTick = false;
const heroDish = $(".hero .dish");
addEventListener("scroll", () => {
  if (spyTick) return; spyTick = true;
  requestAnimationFrame(() => {
    spyTick = false;
    const y = $("#toolbar").getBoundingClientRect().bottom + 8;
    let cur = null;
    document.querySelectorAll("section.cat:not([hidden])").forEach(s => { if (s.getBoundingClientRect().top <= y) cur = s.dataset.cat; });
    setCurrent(cur || DATA.categories[0].slug);
    const max = document.documentElement.scrollHeight - innerHeight;
    $("#toolbar").style.setProperty("--p", max > 0 ? Math.min(1, scrollY / max).toFixed(3) : 0);
    if (!REDUCED && heroDish) heroDish.style.translate = "0 " + Math.min(scrollY, 320) * 0.14 + "px";
  });
}, { passive: true });
setCurrent(DATA.categories[0].slug);

/* destacados: primero los platos con 3D, después los marcados como destacados */
const all = Object.values(bySlug);
const picks = [...all.filter(d => d.model && !d.soldOut), ...all.filter(d => !d.model && d.photo && !d.soldOut && (d.tags || []).includes("destacado"))].slice(0, 8);
if (picks.length) {
  $("#rail").innerHTML = picks.map(d => `
    <button class="card" type="button" data-dish="${d.slug}" data-view="${d.model ? "3d" : "foto"}" aria-haspopup="dialog">
      ${d.model ? '<span class="tag t3d">3D · AR</span>' : ""}
      <span class="ph">${d.photo ? `<img src="img/${d.photo}-360.webp" alt="" loading="lazy">` : ""}</span>
      <span class="n">${esc(d.name)}</span>${fmtDish(d)}
    </button>`).join("");
  $("#spot").hidden = false;
  $("#rail").addEventListener("click", e => { const b = e.target.closest("[data-dish]"); if (b) openDish(b.dataset.dish, "push", { view: b.dataset.view }); });
}
$("#surprise").addEventListener("click", () => {
  const btn = $("#surprise"), label = btn.querySelector("span");
  const pool = all.filter(d => !d.soldOut && d.photo && !["cervezas", "sin-alcohol"].includes(d.cat.slug));
  const pick = pool[Math.floor(Math.random() * pool.length)];
  haptic();
  if (REDUCED) { openDish(pick.slug); return; }
  btn.classList.add("rolling"); label.textContent = "Eligiendo…";
  setTimeout(() => { btn.classList.remove("rolling"); label.textContent = "Sorprendeme"; openDish(pick.slug); }, 700);
});

/* aparición escalonada y destello de títulos (solo con movimiento habilitado) */
if (!REDUCED && "IntersectionObserver" in window) {
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    en.target.classList.add(en.target.matches("section") ? "seen" : "in");
    io.unobserve(en.target);
  }), { rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(".dishes").forEach(ul => [...ul.children].forEach((li, i) => { li.style.setProperty("--i", i % 6); li.classList.add("pre"); io.observe(li); }));
  document.querySelectorAll("section.cat").forEach(sec => io.observe(sec));
}

/* search */
const q = $("#q"), clearQ = $("#clearQ"), empty = $("#empty");
function applySearch() {
  const term = norm(q.value.trim());
  clearQ.hidden = !term;
  let total = 0;
  document.querySelectorAll("section.cat").forEach(sec => {
    let n = 0;
    sec.querySelectorAll("li").forEach(li => { const hit = !term || li.dataset.search.includes(term); li.hidden = !hit; if (hit) n++; });
    sec.hidden = n === 0; total += n;
    sec.querySelector(".count").textContent = term ? `${n} resultado${n === 1 ? "" : "s"}` : `${sec.querySelectorAll("li").length} opciones`;
  });
  empty.hidden = total > 0;
  empty.textContent = total ? "" : `No hay platos que coincidan con «${q.value.trim()}». Probá con un ingrediente, por ejemplo «queso».`;
  chipsEl.querySelectorAll(".chip").forEach(ch => ch.hidden = document.getElementById(ch.dataset.go).hidden);
}
let searchTimer = 0;
q.addEventListener("input", () => {
  applySearch();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const term = norm(q.value.trim()).replace(/[^a-zñ ]/g, "").slice(0, 40).trim();
    if (term.length >= 2) track("search", { q: term, n: document.querySelectorAll("section.cat li:not([hidden])").length }, "q:" + term);
  }, 1000);
});
clearQ.addEventListener("click", () => { q.value = ""; applySearch(); q.focus(); });

/* dish sheet */
const sheet = $("#sheet"), scrim = $("#scrim"), stage = $("#stage");
let lastFocus = null, mvLoading = null;
function loadModelViewer() {
  if (customElements.get("model-viewer")) return Promise.resolve();
  mvLoading ??= new Promise((res, rej) => {
    const s = document.createElement("script");

/* ---------- Mi selección (se guarda en este celular) ---------- */
// One line per dish + options + note: { k, slug, picks: [[itemIndex…] per group], note, n }
const selbar = $("#selbar"), selSheet = $("#selSheet"), live = $("#live");
const SEL_KEY = "pedido:" + location.pathname, OLD_SEL_KEY = "seleccion:" + location.pathname;

  if (saved) lines = saved;

    const old = JSON.parse(localStorage.getItem(OLD_SEL_KEY) || "{}") || {};
    lines = Object.entries(old).map(([slug, n]) => ({ slug, picks: (bySlug[slug]?.options || []).map(() => []), note: "", n }));

} catch (e) { lines = []; }
lines = C.restoreLines(lines, bySlug);

const lineUnit = l => C.unitPrice(bySlug[l.slug], l.picks);
const selCount = () => lines.reduce((a, l) => a + l.n, 0);
const selTotal = () => lines.reduce((a, l) => a + lineUnit(l) * l.n, 0);
const slugCount = slug => lines.reduce((a, l) => a + (l.slug === slug ? l.n : 0), 0);

function renderSel(changed) {
  const n = selCount();
  document.querySelectorAll(".fav[data-fav]").forEach(b => {

function addLine(slug, picks, note, n) {
  const k = C.lineKey(slug, picks, note), d = bySlug[slug];
  const line = lines.find(l => l.k === k);
  if (line) line.n = Math.min(line.n + n, 20); else lines.push({ k, slug, picks, note, n: Math.min(n, 20) });
  saveSel(); haptic(); renderSel(true);
  track("add_item", { dish: slug, cat: d.cat.slug, price: C.unitPrice(d, picks), n });
  live.textContent = `Agregado: ${n} × ${d.name}. ${selCount()} en tu selección, total ${plain(selTotal())}.`;

  saveSel(); haptic(); renderSel(true);
  if (n > before) track("add_item", { dish: d.slug, cat: d.cat.slug, price: lineUnit(line), n: n - before });
  live.textContent = (n > before ? "Agregado: " : n === 0 ? "Quitado: " : "Actualizado: ") + d.name + ". " + selCount() + " en tu selección, total " + plain(selTotal()) + ".";

  if (needsChoice(d)) { openDish(slug); return false; }
  addLine(slug, (d.options || []).map(() => []), "", 1);
  return true;
}

        <div><button class="nm" type="button" data-open="${l.slug}">${esc(d.name)}</button><div class="sub">${lineSub(l)}</div></div>
        <div class="qty" role="group" aria-label="Cantidad de ${esc(d.name)}">
          <button type="button" data-q="${esc(l.k)}" data-d="-1" aria-label="Uno menos">−</button><output aria-live="off">${l.n}</output><button type="button" data-q="${esc(l.k)}" data-d="1" aria-label="Uno más">+</button>
        </div>
      </li>`; }).join("")}</ul>
    ${withForm() ? checkoutHtml() : ""}
    <div class="totals" id="coTotals">${totalsHtml()}</div>
    <div class="order">${orderButtons()}</div>
    <p class="sel-hint">${table ? "Estás en el local: mostrale el pedido al mozo." : WHATSAPP ? "Mandá el pedido por WhatsApp al local, o mostráselo al mozo si estás ahí." : "Mostrale el pedido al mozo."} La lista queda guardada en este celular.</p>
    <button class="sel-clear" type="button" id="selClear">Vaciar la selección</button>`
    : `<p class="sel-hint">Todavía no agregaste platos. Tocá el corazón de cualquier plato para sumarlo acá.</p>`;
  if (lines.length) refreshCheckout();
}
/* ---------- Pedido: por WhatsApp al local o en pantalla para el mozo ---------- */
const WA_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3.5 20.5l1.4-4.2a8.5 8.5 0 1 1 15.6-4.7Z"/><path d="M9 8.5c0 3.5 2.9 6.5 6.5 6.5l1-1.6-2-1-1 .8a4.5 4.5 0 0 1-2.4-2.4l.8-1-1-2L9.3 8Z" fill="currentColor" stroke="none"/></svg>';
const WAITER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>';
const orderText = () => C.orderMessage({ restaurant: RESTAURANT, lines, bySlug, table, cfg: CFG, form: withForm() ? co : null, ref: withForm() ? orderRef() : "" });
/* Mesaverso Caja: the order also goes to the restaurant's screen with a short code that travels in the
   WhatsApp message. The code stays the same while the order doesn't change, so sending twice is stored once.
   If the restaurant doesn't use the caja, the Worker stores nothing. */
const REF_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let refFor = "", refCode = "";
function orderRef() {
  const sig = JSON.stringify([lines.map(l => [l.slug, l.picks, l.note, l.n]), co]);
  if (sig !== refFor) { refFor = sig; refCode = [...crypto.getRandomValues(new Uint8Array(4))].map(b => REF_CHARS[b % 32]).join(""); }
  return refCode;
}
function sendToCaja() {
  try {
    fetch("/api/" + SLUG + "/pedidos", { method: "POST", keepalive: true, headers: { "content-type": "application/json" },
      body: JSON.stringify({ ref: orderRef(), lines: lines.map(({ slug, picks, note, n }) => ({ slug, picks, note, n })),
        form: { type: co.type, name: co.name, address: co.address, reference: co.reference, zone: co.zone, payment: co.payment, cash: co.cash, note: co.note } }) }).catch(() => {});
  } catch (e) { /* WhatsApp is the order; the caja copy is a convenience */ }
}
function orderButtons() {
  const wa = WHATSAPP ? `<a class="${table ? "sel-btn" : "ar-btn"}" id="waBtn" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">${WA_ICON}Enviar pedido por WhatsApp</a>` : "";
  const waiter = `<button class="${table || !WHATSAPP ? "ar-btn" : "sel-btn"}" type="button" id="waiterBtn">${WAITER_ICON}Mostrar al mozo</button>`;
  return table ? waiter + wa : wa + waiter;
}
const waiterEl = $("#waiter");
function openWaiter() {
  track("waiter_show", { n: selCount(), total: selTotal(), mode: table ? "table" : "" });
  waiterEl.innerHTML = `
    <span class="who">${esc(RESTAURANT)} · Pedido</span>
    <h2 class="mesa" id="waiterTitle">${table ? "Mesa " + esc(table) : "Mi pedido"}</h2>
    <ul>${lines.map(l => { const x = C.describePicks(bySlug[l.slug], l.picks); return `<li><b>${l.n}×</b><span>${esc(bySlug[l.slug].name)}${x.length ? `<small class="wx">${esc(x.join(", "))}</small>` : ""}${l.note ? `<small class="wx note">«${esc(l.note)}»</small>` : ""}</span></li>`; }).join("")}</ul>
    <div class="tot"><span>Total</span>${fmt(selTotal())}</div>
    <button class="ar-btn done" type="button" id="waiterDone">Listo</button>`;
  waiterEl.hidden = false;
  $("#waiterDone").focus({ preventScroll: true });
}
function closeWaiter() { waiterEl.hidden = true; $("#waiterBtn")?.focus({ preventScroll: true }); }
waiterEl.addEventListener("click", e => { if (e.target.id === "waiterDone") closeWaiter(); });

$("#selBody").addEventListener("click", e => {
  if (e.target.closest("#waiterBtn")) { openWaiter(); return; }
  if (e.target.closest("#waBtn")) {
    if (withForm()) {
      const st = openNow();
      coTried = true;
      const errs = showCoErrors(), first = CO_FIELDS.find(id => errs[id]);
      if (st && !st.open) {
        e.preventDefault();
        live.textContent = `El local está cerrado. Abre ${st.next}.`;
        $(".notice")?.scrollIntoView({ block: "center" });
        return;
      }
      if (first) {
        e.preventDefault();
        const target = $("#f-" + first);
        const focusEl = target.matches("fieldset") ? target.querySelector("input:checked, input") : target;
        target.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" });
        focusEl.focus({ preventScroll: true });
        live.textContent = errs[first];
        return;
      }
      $("#waBtn").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(orderText())}`;
      sendToCaja();
    }
    // no preventDefault from here on: the wa.me link must open even if the beacon fails
    track("order_tap", { n: selCount(), total: selTotal(), mode: table ? "table" : withForm() ? co.type : "" }); flushEvents();
    return;
  }
  const q = e.target.closest("[data-q]"), o = e.target.closest("[data-open]");
  if (q) { const l = lines.find(x => x.k === q.dataset.q); if (l) setLineQty(l.k, l.n + Number(q.dataset.d)); }
  else if (o) { hideSel(true); openDish(o.dataset.open); }
  else if (e.target.id === "selClear") { lines = []; saveSel(); renderSel(true); live.textContent = "Selección vacía."; }
});
let selLastFocus = null;
function openSel(mode = "push") {
  hideSheet();
  selLastFocus = document.activeElement;
  if (selCount()) track("checkout_view", { n: selCount(), total: selTotal() });
  renderSelPanel();
  scrim.hidden = false; selSheet.hidden = false;
  requestAnimationFrame(() => { scrim.classList.add("open"); selSheet.classList.add("open"); });
  selSheet.scrollTop = 0;
  $("#closeSel").focus({ preventScroll: true });
  document.body.style.overflow = "hidden";
  $("main").inert = true; selbar.inert = true;
  if (mode === "push") history.pushState({ sel: true }, "", location.search + "#seleccion");
  else if (mode === "deep") history.replaceState({ sel: true, deep: true }, "", location.search + "#seleccion");
}
function hideSel(instant) {
  if (selSheet.hidden) return;
  selSheet.classList.remove("open"); selSheet.style.transform = "";
  if (instant) { selSheet.hidden = true; return; }
  scrim.classList.remove("open");
  document.body.style.overflow = "";
  $("main").inert = false; selbar.inert = false;
  setTimeout(() => { if (!selSheet.classList.contains("open")) { selSheet.hidden = true; if (sheet.hidden) scrim.hidden = true; } }, 260);
  selLastFocus?.focus?.({ preventScroll: true });
}
function closeSel() {
  if (history.state && history.state.sel && !history.state.deep) history.back();
  else { hideSel(); history.replaceState(null, "", location.pathname + location.search); }
}
$("#openSel").addEventListener("click", () => openSel());
$("#closeSel").addEventListener("click", closeSel);
swipeToClose(selSheet, closeSel);
renderSel(false);
if (location.hash === "#seleccion") openSel("deep");
else if (location.hash.length > 1 && bySlug[location.hash.slice(1)]) openDish(location.hash.slice(1), "deep");

sheet.addEventListener("click", async e => {
  if (!e.target.closest("#arBtn")) return;
  const d = bySlug[sheet.dataset.dish], note = $("#arNote");
  const mv = $("#mv") || await show3D(d);
  if (mv && mv.canActivateAR) { track("ar_open", { dish: d.slug }); flushEvents(); mv.activateAR(); return; }
  note.hidden = false;
  note.innerHTML = `<span>Para verlo sobre tu mesa, abrí este menú en tu celular: escaneá el código y tocá «Ver en mi mesa».</span><img src="qr.svg" alt="Código QR del menú">`;
});
</script>
</body>
