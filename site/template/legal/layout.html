<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Mesaverso</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#121110">
<link rel="canonical" href="{{CANONICAL}}">
<style>
  /* Mesaverso legal pages, generated by build.mjs from site/template/legal/ (same look as template/privacidad.html) */
  :root { color-scheme: dark; --ink: #121110; --surface: #1b1916; --line: #34302a; --amber: #e8a33d; --text: #f3ede3; --muted: #a89f92; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; padding: 24px 16px 48px; }
  main { max-width: 720px; margin: 0 auto; }
  a { color: var(--amber); }
  h1 { font-size: 26px; line-height: 1.2; margin: 12px 0 4px; }
  h2 { font-size: 18px; margin: 28px 0 8px; color: var(--amber); }
  h3 { font-size: 16px; margin: 18px 0 6px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .review { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--muted); }
  .summary { border: 1px solid var(--amber); border-radius: 12px; padding: 4px 16px; margin: 20px 0; background: var(--surface); }
  nav.legal { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
  nav.legal a { display: inline-flex; align-items: center; min-height: 44px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  @media (max-width: 600px) {
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tr { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
    td { border: 0; padding: 4px 0; }
    td::before { content: attr(data-label); display: block; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
  }
</style>
</head>
<body>
<main>
  <nav class="legal"><a href="../privacidad/">Privacidad</a><a href="../terminos/">Términos</a><a href="../personal/">Personal de la caja</a><a href="{{MESAVERSO_URL}}">mesaverso.app</a></nav>
  <h1>{{TITLE}}</h1>
  <p class="meta">Versión {{VERSION}}</p>
  <p class="review">Texto en revisión legal. Puede cambiar; cada cambio lleva una versión nueva con su fecha.</p>
  <p><b>Quién es Mesaverso:</b> {{HOLDER}}</p>
{{BODY}}
</main>
</body>
</html>
