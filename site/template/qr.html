<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{NAME}} · QR para mesas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Questrial&display=swap">
<style>
  :root { --ink: #121110; --amber: {{PRIMARY}}; --text: #f3ede3; --muted: #6f675c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 "Questrial", "Century Gothic", system-ui, sans-serif; background: #e9e5de; color: #1c1a17; padding: 16px; }
  .bar { max-width: 900px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .bar h1 { font: 700 20px/1.1 "League Spartan", system-ui, sans-serif; margin: 0; }
  .bar p { margin: 4px 0 0; color: var(--muted); }
  .bar button { background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: 600 14px/1 "League Spartan", system-ui, sans-serif; cursor: pointer; }
  .sheet { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--ink); color: var(--text); border-radius: 14px; padding: 22px 20px 18px; display: grid; justify-items: center; gap: 10px; text-align: center; break-inside: avoid; }
  .card .logo { width: 120px; }
  .card .qr { background: #fff; border-radius: 10px; padding: 10px; width: 180px; }
  .card .qr img { display: block; width: 100%; }
  .card strong { font: 700 17px/1.15 "League Spartan", system-ui, sans-serif; color: var(--amber); letter-spacing: .02em; }
  .card span { font-size: 12.5px; color: #cfc7bb; max-width: 24ch; }
  .card .table { font: 700 22px/1 "League Spartan", system-ui, sans-serif; background: var(--amber); color: #15100a; padding: 7px 14px 4px; border-radius: 999px; }
  .card .url { font-size: 10.5px; color: #8b8378; word-break: break-all; }
  @media print {
    body { background: #fff; padding: 0; }
    .bar { display: none; }
    .sheet { grid-template-columns: repeat(2, 1fr); gap: 8mm; max-width: none; }
    .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 10mm; }
  }
</style>
</head>
<body>
  <div class="bar">
    <div>
      <h1>{{NAME}}: QR para mesas</h1>
      <p>Un QR general y uno por mesa. Imprimí en A4 (4 por hoja) y recortá.</p>
    </div>
    <button type="button" onclick="print()">Imprimir</button>
  </div>
  <div class="sheet">{{CARDS}}</div>
</body>
</html>
